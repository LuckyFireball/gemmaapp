name: Build macOS App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pywebview

      - name: Zip Mac Portable Build
        run: |
          mkdir ChippyApp
          cp main.py index.html style.css script.js ChippyApp/
          zip -r Mac-Application.zip ChippyApp

      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Application
          path: Mac-Application.zip
